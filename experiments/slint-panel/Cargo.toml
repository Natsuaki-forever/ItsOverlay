[package]
name = "itsoverlay-slint-panel"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
raw-window-handle = "0.6"
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-software", "raw-window-handle-06", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
strip = true
